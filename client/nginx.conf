# Configuration for serving Angular application
server {
    listen 80;
    server_name localhost;
    #root /usr/share/nginx/html;
    #index index.html;

    location / {
      root /usr/share/nginx/html/browser;
      index index.html;
      try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to your deployed API
    location /api/ {
        proxy_pass https://stocker-app-api-4fv5.onrender.com/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy SignalR hub requests
    location /hubs/ {
        proxy_pass https://stocker-app-api-4fv5.onrender.com/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}